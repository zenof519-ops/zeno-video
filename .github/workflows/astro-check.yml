name: Astro build and GitHub Pages deployment

on:
  push:
    branches: [astro-integration, main]
  pull_request:
    branches: [main]
  # Samedi à 07:00 au Bénin (06:00 UTC).
  schedule:
    - cron: "0 6 * * 6"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Préparer la configuration publique PostHog
        env:
          ZENO_POSTHOG_PROJECT_TOKEN: ${{ vars.ZENO_POSTHOG_PROJECT_TOKEN }}
          ZENO_POSTHOG_HOST: ${{ vars.ZENO_POSTHOG_HOST }}
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, writeFileSync } from 'node:fs';

          const token = process.env.ZENO_POSTHOG_PROJECT_TOKEN?.trim() || '';
          const host = process.env.ZENO_POSTHOG_HOST?.trim() || '';

          if (token && host) {
            const parsedHost = new URL(host);
            if (parsedHost.protocol !== 'https:') {
              throw new Error('PostHog host must use HTTPS.');
            }
            const config = { token, host: parsedHost.origin };
            writeFileSync(
              'public/posthog-config.js',
              `window.ZENO_POSTHOG_CONFIG = ${JSON.stringify(config)};\\n`
            );
            console.log('PostHog configuration prepared from GitHub Actions variables.');
          } else if (existsSync('public/posthog-config.js')) {
            const existing = readFileSync('public/posthog-config.js', 'utf8');
            if (!existing.includes('window.ZENO_POSTHOG_CONFIG')) {
              throw new Error('Existing PostHog config file is invalid; refusing to overwrite it.');
            }
            console.log('GitHub Actions variables are absent; preserving the checked-in PostHog configuration.');
          } else {
            throw new Error('PostHog variables are missing and no checked-in configuration exists.');
          }
          NODE
      - name: Build Astro site
        run: npm run build
      - name: Smoke-test generated pages and assets
        run: npm run test:smoke
      - name: Audit des dépendances de production (sans mise à jour automatique)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - name: Vérifier le site public en ligne
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          set -e
          for path in "/zeno-video/" "/zeno-video/admin.html" "/zeno-video/admin.js?v=42" "/zeno-video/style.css"; do
            echo "Vérification de $path"
            curl --fail --silent --show-error --location --retry 3 --retry-delay 5 --output /dev/null "https://zenof519-ops.github.io$path"
          done
      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy Astro site
        id: deployment
        uses: actions/deploy-pages@v4
